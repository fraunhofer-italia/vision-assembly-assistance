[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-assembly-assistance"
version = "0.1.0"
description = "Single-camera assembly verification and configurable operator guidance"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "fastdtw==0.3.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
analysis = ["pandas==2.2.3", "statsmodels==0.14.5", "matplotlib==3.9.4"]
vision = ["opencv-contrib-python==4.10.0.84", "mediapipe==0.10.14"]
camera = ["depthai==2.21.2.0"]
rfdetr = ["rfdetr>=1.2.0", "supervision>=0.25.1"]
pose = ["ultralytics>=8.3"]
dev = ["pytest==8.3.5", "build==1.2.2.post1"]

[tool.setuptools]
package-dir = {"" = "src", "configs" = "configs", "data" = "data"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["assembly_assistant*", "configs", "data", "data.mocks"]
namespaces = false

[tool.setuptools.package-data]
configs = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
